version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        patterns:
          - '*'
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /juntos-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
