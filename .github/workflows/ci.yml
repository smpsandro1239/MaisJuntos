name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências (raiz)
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Sanidade do bundle (sem ws://localhost)
        run: |
          if grep -rq "ws://localhost" dist/assets/*.js; then
            echo "ERRO: bundle de produção contém ws://localhost"
            exit 1
          fi
          echo "OK: bundle de produção sem ws://localhost"

      - name: Testes de geo
        run: npm run test:geo

      - name: Testes de atomicidade
        run: npm run test:atomic

      - name: Instalar dependências (Worker)
        working-directory: juntos-backend
        run: npm ci

      - name: Lint do Worker (tsc --noEmit)
        working-directory: juntos-backend
        run: npx tsc --noEmit

      - name: Testes do Worker
        working-directory: juntos-backend
        run: npx vitest run
